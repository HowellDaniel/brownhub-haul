# Render Blueprint — one-click deploy of the container.
#
# Put this repository on GitHub, then in Render: New → Blueprint → pick the repo.
# The disk is what makes bookings survive a deploy; Render's free plan does not
# include disks, so this blueprint asks for the Starter plan (about $7/month).
#
# HAUL_TOKEN is generated by Render. Read it once in the dashboard and keep it
# at the desk — it is the dispatch passphrase, not a secret to publish.

services:
  - type: web
    name: brownhub-haul
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT itself; do not pin it here.
      - key: TRUST_PROXY
        value: "1"
      - key: DB
        value: /data/shipments.json
      - key: ACCOUNTS_DB
        value: /data/accounts.json
      - key: PHOTOS
        value: /data/photos
      - key: BRAND_CACHE
        value: /data/brand.json
      # The PIN-sealing key is created automatically at /data/secret.key beside DB.
      - key: PUBLIC_BASE_URL
        value: https://brownhub-haul.onrender.com
      # Set these in the Render dashboard after verifying the sender in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: HAUL_TOKEN
        generateValue: true
    disk:
      name: haul-data
      mountPath: /data
      sizeGB: 1
