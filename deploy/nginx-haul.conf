# Same-domain hosting: https://haul.brownhub283.com/ (or any vhost you own)
#
# The app is mounted at / so the PWA's scope and start_url are the host root.
# If you must mount it under a path, use the /haul/ variant and set the feed to
# https://your-host/haul/ — the app's own URLs are relative and already work.
#
# The app binds 127.0.0.1:8420, so this nginx is the only public door.
# nginx connects over loopback, which is on the app's trust list: it reads
# X-Forwarded-For for the per-client PIN and booking buckets. If nginx runs on
# another machine, start the app with TRUST_PROXY=1 and firewall 8420.

server {
    listen 443 ssl http2;
    server_name haul.brownhub283.com;

    # ssl_certificate     /etc/letsencrypt/live/haul.brownhub283.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/haul.brownhub283.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name haul.brownhub283.com;
    return 301 https://$host$request_uri;
}
