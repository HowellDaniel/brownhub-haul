# Fly.io — the same container on a machine with a volume.
#
#   fly launch --no-deploy --copy-config --name brownhub-haul --region jnb
#   fly volumes create haul_data --region jnb --size 1
#   fly secrets set HAUL_TOKEN='...'      # the dispatch passphrase
#   fly deploy
#
# `jnb` (Johannesburg) is the closest Fly region to Accra. Change it if you like;
# the app itself does not care.

app = "brownhub-haul"
primary_region = "jnb"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8420"
  TRUST_PROXY = "1"
  DB = "/data/shipments.json"
  PHOTOS = "/data/photos"
  BRAND_CACHE = "/data/brand.json"

[mounts]
  source = "haul_data"
  destination = "/data"

[http_service]
  internal_port = 8420
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
